<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Engineering Architecture & Production Catalog — Erfan Mehdi Sadeghi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-badge" onmouseenter="Sound.playHover()">
        <div class="brand-icon">E</div>
        <div>
          <div style="font-weight: 700; font-size: 14px; letter-spacing: -0.01em;">ERFAN.DEV</div>
          <div class="mono" style="font-size: 11px; color: var(--text-dim);">SYSTEM CATALOG</div>
        </div>
      </a>

      <div class="nav-links mono" style="display: flex; gap: 24px; font-size: 13px;">
        <a href="index.html" style="color: var(--text-muted); text-decoration: none;">&larr; Home</a>
        <a href="brew-lab.html" style="color: var(--text-muted); text-decoration: none;">DUN Brew Lab</a>
        <a href="terminal.html" style="color: var(--text-muted); text-decoration: none;">Terminal OS</a>
        <a href="resume.html" style="color: var(--text-muted); text-decoration: none;">Resume</a>
      </div>

      <div class="nav-actions">
        <a href="https://github.com/erfandarrudi527-gif" target="_blank" class="btn-outline mono" style="font-size: 12px;">
          <i class="fa-brands fa-github"></i> GitHub Repos
        </a>
      </div>
    </div>
  </header>

  <main class="container" style="padding: 60px 24px 100px;">
    
    <div class="section-header" style="margin-bottom: 40px;">
      <span class="section-tag mono">// FULL ARCHIVE</span>
      <h1 class="section-title">Verified Production Projects & Architecture</h1>
      <p style="color: var(--text-muted); font-size: 15px; margin-top: 8px;">
        Complete breakdown of deployed web apps, headless CMS setups, progressive web apps, and design systems.
      </p>
    </div>

    <!-- Filter Bar -->
    <div class="filter-bar">
      <div class="filter-pills mono">
        <button class="filter-pill active" data-cat="all">ALL REPOSITORIES</button>
        <button class="filter-pill" data-cat="web-apps">WEB APPS</button>
        <button class="filter-pill" data-cat="ecommerce">E-COMMERCE</button>
        <button class="filter-pill" data-cat="mobile">MOBILE & PWA</button>
        <button class="filter-pill" data-cat="tools">DEV TOOLS</button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-dim); font-size: 12px;"></i>
        <input type="text" id="projectSearchInput" placeholder="Filter by tech stack or keyword...">
      </div>
    </div>

    <!-- Projects Grid -->
    <div class="projects-grid" id="projectsGrid"></div>

  </main>

  <!-- Spec Modal -->
  <div class="modal-overlay" id="projectModalOverlay" onclick="if(event.target === this) closeProjectModal();">
    <div class="modal-box">
      <button class="modal-close" onclick="closeProjectModal();">&times;</button>
      <div id="projectModalBody"></div>
    </div>
  </div>

  <script src="projects.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
