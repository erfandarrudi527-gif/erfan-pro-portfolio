<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ثبت‌نام حساب کاربری | هتل ۵ ستاره مهستان</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../style/style.css"/>
  <link rel="stylesheet" href="../style/register.css"/>
</head>
<body>

  <header>
    <nav class="main-navbar">
      <div class="navbar-brand">
        <a href="../index.html" style="display: flex; align-items: center; gap: 12px;">
          <img src="../assets/image/logo-light.svg" alt="لوگو هتل مهستان" class="logo-img"/>
          <div class="brand-text">
            <h1>هتل و اقامتگاه مهستان</h1>
            <span>رزرواسیون آنلاین پنج ستاره</span>
          </div>
        </a>
      </div>
      <div class="navbar-links">
        <a href="../index.html" class="navbar-link">صفحه اصلی</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-box reveal">
      <div class="auth-header">
        <h1>ایجاد حساب کاربری</h1>
        <p>برای رزرو سریع‌تر و دریافت تخفیف‌های ویژه عضو شوید</p>
      </div>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullName">نام و نام خانوادگی</label>
          <input type="text" id="fullName" placeholder="مثلاً: علی محمدی" required />
        </div>

        <div class="form-group">
          <label for="email">پست الکترونیک (ایمیل)</label>
          <input type="email" id="email" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="password">رمز عبور</label>
          <div class="password-field">
            <input type="password" id="password" placeholder="حداقل ۶ کاراکتر" required />
            <button type="button" id="togglePassword" class="toggle-password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">تکرار رمز عبور</label>
          <input type="password" id="confirmPassword" placeholder="تکرار رمز عبور" required />
        </div>

        <p id="registerMessage" class="auth-message"></p>
        <button type="submit" class="auth-btn">ثبت‌نام و عضویت</button>
      </form>

      <div class="auth-footer">
        <p>قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/register.js"></script>
</body>
</html>
