<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ورود به حساب کاربری | هتل ۵ ستاره مهستان</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link rel="stylesheet" href="../style/style.css"/>
  <link rel="stylesheet" href="../style/login.css"/>
</head>
<body>

  <!-- Main Header & Navbar -->
  <header>
    <nav class="main-navbar">
      <div class="navbar-brand">
        <a href="../index.html" style="display: flex; align-items: center; gap: 12px;">
          <img src="../assets/image/logo-light.svg" alt="لوگو هتل مهستان" class="logo-img"/>
          <div class="brand-text">
            <h1>هتل و اقامتگاه مهستان</h1>
            <span>رزرواسیون آنلاین پنج ستاره</span>
          </div>
        </a>
      </div>
      <div class="navbar-links">
        <a href="../index.html" class="navbar-link">صفحه اصلی</a>
        <a href="Room.html" class="navbar-link">اتاق‌ها</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <div class="auth-box reveal">
      <div class="auth-header">
        <h1>ورود به حساب کاربری</h1>
        <p>جهت مدیریت رزروها و دسترسی به خدمات VIP وارد شوید</p>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">ایمیل یا شماره همراه</label>
          <input type="email" id="loginEmail" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">رمز عبور</label>
          <div class="password-field">
            <input type="password" id="loginPassword" placeholder="رمز عبور خود را وارد کنید" required />
            <button type="button" id="toggleLoginPassword" class="toggle-password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <p id="loginMessage" class="auth-message"></p>
        <button type="submit" class="auth-btn">ورود به سامانه</button>
      </form>

      <div class="auth-footer">
        <p>هنوز حساب کاربری ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
